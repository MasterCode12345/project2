[project]
name = "audio-translator"
version = "0.1.0"
description = "Vietnamese to English speech translation into a virtual microphone (macOS, BlackHole)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "soxr>=0.3.7",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.0.3",
    "deep-translator>=1.11.4",
    "edge-tts>=7.3.1",
    "miniaudio>=1.61",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
]

[project.scripts]
audio-translator = "audio_translator.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
